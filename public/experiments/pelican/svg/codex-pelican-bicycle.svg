<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican pedals a teal bicycle beneath a sunny sky.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#dff5f1"/>
      <stop offset="1" stop-color="#f8f4df"/>
    </linearGradient>
    <linearGradient id="beak" x2="0" y2="1">
      <stop stop-color="#ffbd53"/>
      <stop offset="1" stop-color="#f08036"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#31535a" flood-opacity=".15"/>
    </filter>
    <style>
      .ink { stroke:#25444b; stroke-width:12; stroke-linecap:round; stroke-linejoin:round; }
      .bike { fill:none; stroke:#247e83; stroke-width:13; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1000" height="720" rx="36" fill="url(#sky)"/>
  <circle cx="805" cy="130" r="58" fill="#ffd66d"/>
  <path d="M0 510 Q150 470 300 510 T600 505 T1000 500 V720 H0Z" fill="#d5e9bf"/>
  <path d="M0 580 Q180 540 370 580 T760 570 T1000 575 V720 H0Z" fill="#b9d79e"/>
  <g fill="#fffdf5" opacity=".8">
    <path d="M135 145c10-24 47-27 61-4 25-7 43 11 39 30H119c-7-14 1-25 16-26Z"/>
    <path d="M680 245c8-19 38-23 50-3 20-6 35 9 31 24H668c-6-11 0-20 12-21Z"/>
  </g>

  <!-- Bicycle wheels and frame -->
  <g filter="url(#soft-shadow)">
    <g fill="#f8f6e9" stroke="#25444b" stroke-width="10">
      <circle cx="300" cy="535" r="104"/>
      <circle cx="700" cy="535" r="104"/>
    </g>
    <g stroke="#aac9bd" stroke-width="4" opacity=".9">
      <path d="M300 431v208M196 535h208M226 461l148 148M374 461 226 609"/>
      <path d="M700 431v208M596 535h208M626 461l148 148M774 461 626 609"/>
    </g>
    <path class="bike" d="M300 535 420 535 515 390 610 535 700 535 620 365 515 390 420 535 380 435"/>
    <path class="bike" d="M574 357h92M620 365l18-42M385 435h-72"/>
    <circle cx="420" cy="535" r="21" fill="#f3b84b" stroke="#25444b" stroke-width="9"/>
    <path d="M420 535 458 570M420 535 387 503" fill="none" stroke="#25444b" stroke-width="9" stroke-linecap="round"/>
    <path d="M449 570h27M376 503h27" fill="none" stroke="#25444b" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Pelican body and wing -->
  <g filter="url(#soft-shadow)">
    <path d="M364 373c-13-85 38-153 120-158 77-5 128 42 139 113 5 34-4 70-26 96l-166 5c-34-9-58-28-67-56Z" fill="#fffdf7" class="ink"/>
    <path d="M405 353c22-47 72-67 119-47 24 10 41 29 49 52-34 29-86 42-135 29-16-5-27-16-33-34Z" fill="#e8f0e8" stroke="#25444b" stroke-width="9" stroke-linejoin="round"/>
    <path d="M407 371c39-17 83-14 124 8" fill="none" stroke="#c5d9d1" stroke-width="8" stroke-linecap="round"/>
    <!-- neck and head -->
    <path d="M493 247c7-39 5-86 30-119 17-23 50-25 69-7 19 18 13 48-5 67-16 17-35 31-38 61l-56 17Z" fill="#fffdf7" class="ink"/>
    <path d="M543 205c-1-32 24-50 48-64" fill="none" stroke="#d7e5dc" stroke-width="9" stroke-linecap="round"/>
    <!-- long bill and pouch -->
    <path d="M567 142c65-21 147-12 203 12-48 21-119 35-195 19-11-2-17-20-8-31Z" fill="url(#beak)" class="ink"/>
    <path d="M575 173c47 34 101 69 116 122 4 15-8 28-24 22-45-17-77-68-102-125Z" fill="#ee8b55" stroke="#25444b" stroke-width="10" stroke-linejoin="round"/>
    <path d="M583 179c31 15 59 31 82 54" fill="none" stroke="#ffd28a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="552" cy="132" r="7" fill="#25444b"/>
    <circle cx="554" cy="130" r="2.5" fill="#fff"/>
    <path d="M528 112c10-9 24-12 36-7" fill="none" stroke="#25444b" stroke-width="7" stroke-linecap="round"/>
    <!-- feet reaching the pedals -->
    <path d="M444 421c-12 37-17 65-15 91M488 426c-3 41-2 69 8 96" fill="none" stroke="#e38c46" stroke-width="13" stroke-linecap="round"/>
    <path d="M427 509c-24 12-32 24-24 33 8 9 25 5 44-8M495 515c-10 19-6 34 5 36 12 2 19-12 19-30" fill="none" stroke="#e38c46" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#25444b" opacity=".75">
    <circle cx="145" cy="408" r="5"/><circle cx="849" cy="395" r="6"/><circle cx="810" cy="445" r="4"/>
  </g>
  <path d="M90 652h820" stroke="#87ad78" stroke-width="4" stroke-linecap="round" opacity=".5"/>
</svg>
