<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="A pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9adf7a"/>
      <stop offset="100%" stop-color="#5fc24a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6b0"/>
      <stop offset="70%" stop-color="#ffd93b"/>
      <stop offset="100%" stop-color="#ffd93b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="90" fill="url(#sun)"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="110" rx="55" ry="28"/>
    <ellipse cx="200" cy="100" rx="45" ry="30"/>
    <ellipse cx="110" cy="120" rx="40" ry="22"/>
    <ellipse cx="560" cy="180" rx="48" ry="24"/>
    <ellipse cx="610" cy="172" rx="38" ry="26"/>
  </g>
  <rect x="0" y="470" width="800" height="130" fill="url(#ground)"/>
  <ellipse cx="400" cy="480" rx="430" ry="22" fill="#7ed45f" opacity="0.55"/>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="70" y1="300" x2="150" y2="300"/>
    <line x1="50" y1="340" x2="140" y2="340"/>
    <line x1="80" y1="380" x2="150" y2="380"/>
  </g>

  <!-- ================= BICYCLE ================= -->
  <g>
    <!-- wheels -->
    <g fill="none" stroke="#2b2b2b" stroke-width="9">
      <circle cx="250" cy="430" r="78"/>
      <circle cx="560" cy="430" r="78"/>
    </g>
    <g fill="none" stroke="#9aa0a6" stroke-width="3">
      <circle cx="250" cy="430" r="62"/>
      <circle cx="560" cy="430" r="62"/>
      <!-- rear spokes -->
      <line x1="250" y1="352" x2="250" y2="508"/>
      <line x1="172" y1="430" x2="328" y2="430"/>
      <line x1="195" y1="375" x2="305" y2="485"/>
      <line x1="305" y1="375" x2="195" y2="485"/>
      <!-- front spokes -->
      <line x1="560" y1="352" x2="560" y2="508"/>
      <line x1="482" y1="430" x2="638" y2="430"/>
      <line x1="505" y1="375" x2="615" y2="485"/>
      <line x1="615" y1="375" x2="505" y2="485"/>
    </g>
    <!-- hubs -->
    <circle cx="250" cy="430" r="9" fill="#6b6b6b"/>
    <circle cx="560" cy="430" r="9" fill="#6b6b6b"/>

    <!-- frame -->
    <g fill="none" stroke="#e8483c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <!-- chain stay + seat stay (rear triangle) -->
      <path d="M415 430 L250 430"/>
      <path d="M415 430 L340 300"/>
      <path d="M250 430 L340 300"/>
      <!-- seat tube -->
      <path d="M415 430 L340 300"/>
      <!-- down tube -->
      <path d="M415 430 L545 300"/>
      <!-- top tube -->
      <path d="M340 300 L545 300"/>
      <!-- head tube -->
      <path d="M545 300 L560 430"/>
    </g>
    <!-- dropouts / frame details -->
    <circle cx="415" cy="430" r="14" fill="#e8483c"/>

    <!-- chain -->
    <g fill="none" stroke="#555" stroke-width="4">
      <path d="M415 430 L250 430"/>
    </g>
    <circle cx="250" cy="430" r="16" fill="none" stroke="#444" stroke-width="4"/>
    <circle cx="415" cy="430" r="22" fill="none" stroke="#444" stroke-width="4"/>

    <!-- cranks + pedals -->
    <g stroke="#333" stroke-width="8" stroke-linecap="round">
      <line x1="415" y1="430" x2="440" y2="392"/>
      <line x1="415" y1="430" x2="390" y2="468"/>
    </g>
    <rect x="428" y="384" width="34" height="14" rx="4" fill="#222" transform="rotate(-20 445 391)"/>
    <rect x="376" y="462" width="34" height="14" rx="4" fill="#222" transform="rotate(-20 393 469)"/>

    <!-- seat -->
    <path d="M300 296 C320 284 372 284 392 296 C372 312 320 312 300 296 Z" fill="#333"/>
    <!-- handlebars -->
    <path d="M545 300 L548 268" stroke="#333" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M520 262 C548 250 578 258 596 276" stroke="#333" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ================= PELICAN ================= -->
  <g>
    <!-- legs to pedals -->
    <g stroke="#f0a04b" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M372 250 L392 466"/>   <!-- to lower pedal -->
      <path d="M372 250 L440 388"/>   <!-- to upper pedal -->
    </g>
    <path d="M376 462 L424 462 L430 470 L370 470 Z" fill="#f0a04b"/>
    <path d="M424 384 L472 384 L478 392 L418 392 Z" fill="#f0a04b"/>

    <!-- tail -->
    <path d="M300 220 C270 205 250 210 240 230 C262 232 280 236 300 244 Z" fill="#f7f7f2" stroke="#dcdcd0" stroke-width="3"/>

    <!-- body -->
    <ellipse cx="355" cy="225" rx="82" ry="66" fill="#ffffff" stroke="#e2e2d8" stroke-width="3" transform="rotate(-8 355 225)"/>

    <!-- wing -->
    <path d="M320 205 C360 178 420 190 446 228 C420 246 360 252 322 238 C306 230 306 214 320 205 Z"
          fill="#f2f2ea" stroke="#dcdcd0" stroke-width="3"/>
    <g stroke="#d8d8cc" stroke-width="2" fill="none">
      <path d="M330 212 C362 206 396 210 430 226"/>
      <path d="M328 224 C362 220 396 224 432 236"/>
    </g>

    <!-- neck -->
    <path d="M392 196 C398 150 418 116 452 104 L478 132 C446 148 428 176 424 206 Z"
          fill="#ffffff" stroke="#e2e2d8" stroke-width="3"/>

    <!-- head -->
    <circle cx="470" cy="118" r="36" fill="#ffffff" stroke="#e2e2d8" stroke-width="3"/>
    <!-- crest -->
    <path d="M448 88 C456 70 480 66 496 80 C486 86 470 92 462 98 Z" fill="#f4f4ec" stroke="#e0e0d4" stroke-width="2"/>

    <!-- eye -->
    <circle cx="486" cy="112" r="6.5" fill="#222"/>
    <circle cx="488" cy="110" r="2.2" fill="#fff"/>

    <!-- upper beak -->
    <path d="M498 106 C560 100 616 108 648 124 C616 128 560 132 500 128 Z"
          fill="#ffca3a" stroke="#e6a700" stroke-width="3"/>
    <!-- lower beak / pouch -->
    <path d="M500 130 C548 136 596 142 640 130 C600 168 536 168 502 142 Z"
          fill="#ffb703" stroke="#e6a700" stroke-width="3"/>
    <g stroke="#e6a700" stroke-width="2" fill="none" opacity="0.7">
      <path d="M512 134 C548 146 590 148 622 138"/>
    </g>

    <!-- little hat for fun -->
    <path d="M440 82 L500 82 L494 66 L446 66 Z" fill="#2b6cb0"/>
    <rect x="452" y="52" width="36" height="20" rx="4" fill="#2b6cb0"/>
    <rect x="430" y="78" width="84" height="9" rx="4" fill="#1f4e79"/>
  </g>

  <!-- dust puffs under wheels -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="180" cy="490" r="14"/>
    <circle cx="150" cy="482" r="10"/>
    <circle cx="120" cy="492" r="8"/>
  </g>
</svg>
